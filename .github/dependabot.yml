version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-and-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "YamlDotNet", "docfx"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
