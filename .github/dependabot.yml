version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-and-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "YamlDotNet", "docfx"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The SDK is pinned exactly (global.json and every setup-dotnet step), because the SDK decides the implicit
  # Microsoft.NET.ILLink.Tasks version in the lock files. A bump here also needs `dotnet restore --force-evaluate`.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
