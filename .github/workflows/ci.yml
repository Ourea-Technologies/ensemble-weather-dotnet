# SPDX-License-Identifier: BSD-2-Clause
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  lint:
    name: Format, analyzers, dependencies, spec pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore EnsembleWeather.sln --locked-mode
      - name: Format check
        run: dotnet format EnsembleWeather.sln --verify-no-changes --no-restore
      - name: Build (analyzers, nullable, warnings as errors)
        run: dotnet build EnsembleWeather.sln -c Release --no-restore
      - name: Runtime dependencies are justified
        run: scripts/check-dependencies
      - name: spec/ matches spec/VERSION
        run: scripts/sync-spec --check

  test:
    name: Tests and vectors (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore EnsembleWeather.sln --locked-mode
      - name: Unit tests, all shared vectors, spec drift
        run: >-
          dotnet test tests/EnsembleWeather.Tests -c Release --no-restore -f ${{ matrix.framework }}
          --collect "XPlat Code Coverage" --results-directory coverage --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.framework }}
          path: coverage/

  examples:
    name: Examples (against the local mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore EnsembleWeather.sln --locked-mode
      - run: scripts/run-examples

  docs-and-pack:
    name: Docs and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore EnsembleWeather.sln --locked-mode
      - run: dotnet tool restore
      - name: API reference (DocFX, warnings as errors)
        run: dotnet docfx docs/docfx.json
      - name: Pack (.nupkg + .snupkg, package validation)
        run: dotnet pack EnsembleWeather.sln -c Release --no-restore -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/
